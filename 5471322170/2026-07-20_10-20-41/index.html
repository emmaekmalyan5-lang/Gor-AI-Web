<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --btn-bg: #fff;
            --btn-hover: #e0e0e0;
            --operator-bg: #ff9500;
            --operator-hover: #e08900;
            --accent: #333;
            --font: 1.2rem;
        }
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            font-family: Arial, Helvetica, sans-serif;
        }
        #calculator {
            width: 340px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #display {
            width: 100%;
            height: 60px;
            font-size: 1.8rem;
            text-align: right;
            padding: 0 15px;
            border: none;
            background: #222;
            color: #fff;
        }
        #display:focus {
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #ccc;
        }
        .btn {
            padding: 20px;
            font-size: var(--font);
            border: none;
            background: var(--btn-bg);
            cursor: pointer;
            transition: background .2s;
        }
        .btn:hover {
            background: var(--btn-hover);
        }
        .operator {
            background: var(--operator-bg);
            color: #fff;
        }
        .operator:hover {
            background: var(--operator-hover);
        }
        @media (max-width: 600px) {
            #calculator {
                width: 95%;
            }
            .btn {
                padding: 15px;
                font-size: 1rem;
            }
            #display {
                height: 50px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <section id="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="/">÷</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="*">×</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="-">−</button>

            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn" id="clear">C</button>
            <button class="btn operator" data-value="+">+</button>

            <button class="btn" data-value="(">(</button>
            <button class="btn" data-value=")">)</button>
            <button class="btn" id="equals" class="operator" style="grid-column: span 2;">=</button>
        </div>
    </section>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('.btn[data-value]');
        const clearBtn = document.getElementById('clear');
        const equalsBtn = document.getElementById('equals');

        let expression = '';

        const updateDisplay = () => {
            display.value = expression || '0';
        };

        const addToExpression = (char) => {
            expression += char;
            updateDisplay();
        };

        const clearExpression = () => {
            expression = '';
            updateDisplay();
        };

        const evaluateExpression = () => {
            if (!expression) return;
            try {
                // безопасная проверка: допускаются только цифры, операторы, точки, скобки
                if (!/^[0-9+\-*/().\s]+$/.test(expression)) throw new Error('Недопустимые символы');
                // заменяем ÷ и × на соответствующие символы
                const safeExpr = expression.replace(/÷/g, '/').replace(/×/g, '*');
                // eslint-disable-next-line no-eval
                const result = Function(`"use strict";return (${safeExpr})`)();
                if (result === Infinity || result === -Infinity) throw new Error('Деление на 0');
                expression = String(result);
            } catch (e) {
                expression = 'Error';
            }
            updateDisplay();
        };

        buttons.forEach(btn => {
            btn.addEventListener('click', () => addToExpression(btn.dataset.value));
        });

        clearBtn.addEventListener('click', clearExpression);
        equalsBtn.addEventListener('click', evaluateExpression);

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (/\d/.test(key)) {
                addToExpression(key);
            } else if (['+', '-', '*', '/', '.', '(', ')'].includes(key)) {
                addToExpression(key);
            } else if (key === 'Enter') {
                evaluateExpression();
                e.preventDefault();
            } else if (key === 'Escape') {
                clearExpression();
            } else if (key === 'Backspace') {
                expression = expression.slice(0, -1);
                updateDisplay();
            }
        });
    </script>
</body>
</html>
