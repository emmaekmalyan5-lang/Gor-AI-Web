<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazdai Kalkulyatr</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #ecf0f1;
            --error: #e74c3c;
            --success: #27ae60;
            --radius: 6px;
        }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background:#fff;
            border-radius: var(--radius);
            box-shadow:0 2px 8px rgba(0,0,0,.1);
            max-width: 420px;
            width: 100%;
            padding: 2rem;
            display: grid;
            gap: 1.5rem;
        }
        h1 {
            margin:0;
            font-size:1.5rem;
            text-align:center;
            color: var(--primary);
        }
        form {
            display: grid;
            gap: 1rem;
        }
        label {
            display:flex;
            flex-direction:column;
            font-weight:500;
        }
        input[type="number"] {
            padding: .5rem;
            border:1px solid #ccc;
            border-radius: var(--radius);
            font-size:1rem;
        }
        .error-msg {
            color: var(--error);
            font-size:.85rem;
            min-height:1.2em;
        }
        button {
            background: var(--accent);
            color:#fff;
            border:none;
            border-radius: var(--radius);
            padding:.75rem;
            font-size:1rem;
            cursor:pointer;
            transition:background .2s;
        }
        button:hover {
            background:#2980b9;
        }
        .result {
            padding:.75rem;
            border:1px solid var(--accent);
            border-radius: var(--radius);
            background:#f9f9f9;
            font-weight:600;
            min-height:2.5rem;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        @media (max-width: 480px) {
            .container { padding:1.5rem; }
        }
    </style>
</head>
<body>
<div class="container" aria-live="polite">
    <h1>Sazdai Kalkulyatr</h1>
    <form id="calc-form" novalidate>
        <label for="num1">
            Число 1
            <input type="number" id="num1" name="num1" required aria-required="true" min="0" step="any">
            <span class="error-msg" id="err-num1" aria-live="assertive"></span>
        </label>
        <label for="num2">
            Число 2
            <input type="number" id="num2" name="num2" required aria-required="true" min="0" step="any">
            <span class="error-msg" id="err-num2" aria-live="assertive"></span>
        </label>
        <button type="submit" id="calc-btn">Рассчитать</button>
    </form>
    <div class="result" id="result" aria-label="Результат расчёта"></div>
</div>

<script type="module">
    // ---- calcModule.js ----
    const calcModule = (() => {
        const round = (num, places = 2) => Number(Math.round(num + 'e' + places) + 'e-' + places);

        // Пример расчёта: (a + b) * 1.23
        function compute(a, b) {
            if (typeof a !== 'number' || typeof b !== 'number') throw new Error('Invalid arguments');
            const raw = (a + b) * 1.23;
            return round(raw);
        }

        // Валидация полей
        function validate(value, {min = -Infinity, max = Infinity} = {}) {
            if (value === '' || value === null || value === undefined) return 'Поле обязательно';
            const num = Number(value);
            if (Number.isNaN(num)) return 'Введите число';
            if (num < min) return `Не меньше ${min}`;
            if (num > max) return `Не больше ${max}`;
            return '';
        }

        // Тесты (console‑based)
        function runTests() {
            const assert = (cond, msg) => { if (!cond) console.error('Test failed:', msg); };
            // compute tests
            assert(compute(0,0) === 0, '0+0');
            assert(compute(10,5) === round((10+5)*1.23), '10+5');
            // validate tests
            assert(validate('',{}) === 'Поле обязательно', 'empty');
            assert(validate('abc',{}) === 'Введите число', 'non‑numeric');
            assert(validate('5',{min:10}) === 'Не меньше 10', 'min check');
            console.log('All tests executed');
        }

        return { compute, validate, runTests };
    })();

    // ---- UI logic ----
    const form = document.getElementById('calc-form');
    const resultDiv = document.getElementById('result');
    const errNum1 = document.getElementById('err-num1');
    const errNum2 = document.getElementById('err-num2');

    form.addEventListener('submit', e => {
        e.preventDefault();
        const v1 = form.num1.value.trim();
        const v2 = form.num2.value.trim();

        const err1 = calcModule.validate(v1, {min:0});
        const err2 = calcModule.validate(v2, {min:0});

        errNum1.textContent = err1;
        errNum2.textContent = err2;

        if (err1 || err2) {
            resultDiv.textContent = '';
            return;
        }

        const a = Number(v1);
        const b = Number(v2);
        try {
            const res = calcModule.compute(a, b);
            resultDiv.textContent = `${res} ед.`;
        } catch (ex) {
            resultDiv.textContent = 'Ошибка расчёта';
            console.error(ex);
        }
    });

    // Run unit tests once (remove in production if not needed)
    calcModule.runTests();
</script>
</body>
</html>
