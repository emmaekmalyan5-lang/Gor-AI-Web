<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #f5f5f5;
            --bg-dark: #212121;
            --btn-bg: #ffffff;
            --btn-bg-dark: #424242;
            --btn-color: #212121;
            --btn-color-dark: #e0e0e0;
            --accent: #6200ea;
            --accent-dark: #bb86fc;
            --shadow: rgba(0,0,0,0.2);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: var(--bg-dark);
                --btn-bg: var(--btn-bg-dark);
                --btn-color: var(--btn-color-dark);
                --accent: var(--accent-dark);
            }
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--btn-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .calculator {
            width: 100%;
            max-width: 340px;
            padding: 1rem;
            background: var(--btn-bg);
            border-radius: 0.8rem;
            box-shadow: 0 4px 12px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .display {
            width: 100%;
            height: 3rem;
            font-size: 1.5rem;
            text-align: right;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            background: #e0e0e0;
            color: inherit;
        }
        .display:focus {
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        button {
            font-size: 1.2rem;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--btn-bg);
            color: var(--btn-color);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: var(--accent);
            color: #fff;
        }
        button:active {
            transform: scale(0.96);
        }
        .operator {
            background: var(--accent);
            color: #fff;
        }
        .operator:hover {
            background: #7e3ff2;
        }
        .wide {
            grid-column: span 2;
        }
        @media (max-width: 400px) {
            .display {
                height: 2.5rem;
                font-size: 1.3rem;
            }
            button {
                padding: 0.6rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" readonly class="display" id="display" value="">
        <div class="buttons">
            <button class="wide" data-action="clear">C</button>
            <button data-action="backspace">←</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-value="0" class="wide">0</button>
            <button data-value=".">.</button>
            <button class="operator" data-action="equals">=</button>
        </div>
    </div>

    <script>
        (function () {
            const display = document.getElementById('display');
            let expression = '';

            const isOperator = ch => /[+\-*/]/.test(ch);
            const safeEval = exp => {
                // allow numbers, operators, decimal point, parentheses
                if (!/^[0-9+\-*/.() ]+$/.test(exp)) throw new Error('Invalid characters');
                // replace repeated operators (e.g., ++, --) which are not allowed
                if (/[+\-*/]{2,}/.test(exp.replace(/\s+/g, ''))) throw new Error('Invalid syntax');
                // evaluate
                // eslint-disable-next-line no-new-func
                return Function(`"use strict"; return (${exp})`)();
            };

            const updateDisplay = () => {
                display.value = expression || '0';
            };

            const addChar = ch => {
                // prevent two operators in a row
                const last = expression.slice(-1);
                if (isOperator(ch)) {
                    if (!expression) return; // cannot start with operator
                    if (isOperator(last)) {
                        // replace previous operator
                        expression = expression.slice(0, -1) + ch;
                    } else {
                        expression += ch;
                    }
                } else if (ch === '.') {
                    // allow only one dot per number segment
                    const parts = expression.split(/[+\-*/]/);
                    const lastPart = parts[parts.length - 1];
                    if (lastPart.includes('.')) return;
                    expression += ch;
                } else {
                    expression += ch;
                }
                updateDisplay();
            };

            const clearAll = () => {
                expression = '';
                updateDisplay();
            };

            const backspace = () => {
                expression = expression.slice(0, -1);
                updateDisplay();
            };

            const calculate = () => {
                try {
                    const result = safeEval(expression);
                    expression = String(result);
                } catch (e) {
                    expression = 'Error';
                }
                updateDisplay();
            };

            document.querySelectorAll('.buttons button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const value = btn.getAttribute('data-value');
                    const action = btn.getAttribute('data-action');

                    if (action === 'clear') clearAll();
                    else if (action === 'backspace') backspace();
                    else if (action === 'equals') calculate();
                    else if (value) addChar(value);
                });
            });

            // Keyboard support
            document.addEventListener('keydown', e => {
                const key = e.key;
                if (/[0-9]/.test(key)) addChar(key);
                else if (key === '.') addChar('.');
                else if (key === '+' ) addChar('+');
                else if (key === '-') addChar('-');
                else if (key === '*') addChar('*');
                else if (key === '/' || key === '÷') addChar('/');
                else if (key === 'Enter') { e.preventDefault(); calculate(); }
                else if (key === 'Backspace') backspace();
                else if (key === 'Escape') clearAll();
            });
        })();
    </script>
</body>
</html>
